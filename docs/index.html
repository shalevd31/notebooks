<style>
/* Layout: a desk with notebook covers on it → open a notebook to its contents page → open a topic to its lined pages */
:root{
  --desk:#e6ebf1; --desk-2:#d7dee8; --fg:#1f2633; --muted:#5a6475; --line:#c3ccd8; --focus:#3a7bd5;
  --paper:#fdfdf7; --ink:#2a2a3c; --rule:#c9d8ec; --margin:#e88a8a; --pen-pink:#e0628f; --pen-blue:#3a9ad9;
  --hl-y:#fff59d; --hl-p:#f8c8e0; --hl-b:#b9e3f7; --hl-g:#c9e8c0; --hl-tan:#e8d3a8;
  --f-title:'Amatic SC', 'Rubik', cursive; --f-hand:'Playpen Sans Hebrew', 'Rubik', system-ui, sans-serif; --f-ui:'Rubik', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --desk:#171c26; --desk-2:#222a38; --fg:#e8ecf3; --muted:#9aa5b8; --line:#33405a; --focus:#7fb0ff; color-scheme:dark } }
:root[data-theme="dark"]{ --desk:#171c26; --desk-2:#222a38; --fg:#e8ecf3; --muted:#9aa5b8; --line:#33405a; --focus:#7fb0ff; color-scheme:dark }

body{background:var(--desk);color:var(--fg);font-family:var(--f-ui);font-size:16px}
.wrap{max-width:1000px;margin-inline:auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:28px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--f-title);font-size:56px;line-height:1;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:8px;background:var(--desk-2);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px}
.back:hover{border-color:var(--muted)}
.crumbs{color:var(--muted);font-size:15px}

/* shelf */
.shelf{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:clamp(10px, 3vw, 32px)}
.cover svg.tt{flex:none;height:auto;overflow:visible;margin-block:4px}
.top h1 svg{display:block;height:64px;width:auto;max-width:100%;overflow:visible}
.ttl svg{display:block;width:100%;max-width:440px;height:auto;overflow:visible}
@container (max-width: 150px){ .cfoot{display:none} }
/* each cover = a hand-decorated title page: lined paper, spiral, bubble-letter title, subject doodles */
.cover{all:unset;box-sizing:border-box;cursor:pointer;position:relative;container-type:inline-size;aspect-ratio:3/4;max-width:100%;border-radius:4px 10px 10px 4px;background-color:#fbfbf6;background-image:repeating-linear-gradient(to bottom, transparent 0 17px, #d6dde8 17px 18px);padding:14px 34px 12px 14px;display:flex;flex-direction:column;align-items:stretch;box-shadow:0 1px 2px rgba(0,0,0,.1),0 10px 24px rgba(20,30,50,.18);transition:transform .2s;color:#2a2a3c}
.cover:hover{transform:translateY(-4px) rotate(-.6deg)}
.cover:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.cover::after{content:"";position:absolute;inset:10px 8px 10px auto;width:12px;background:radial-gradient(circle at 6px 6px, #4a5263 3px, transparent 3.6px) 0 0/12px 14px repeat-y}
.cover svg{display:block;width:100%;flex:1 1 0;min-height:0}
.bubble{font-family:'Rubik', 'Arial Black', system-ui, sans-serif;font-weight:900;font-size:17cqi;line-height:1.08;text-align:center;text-wrap:balance;padding-block:6px;color:var(--fill);-webkit-text-stroke:.05em #2a2a3c;paint-order:stroke fill;
  text-shadow:0 .07em 0 #fff,0 -.07em 0 #fff,.07em 0 0 #fff,-.07em 0 0 #fff,.05em .05em 0 #fff,-.05em .05em 0 #fff,.05em -.05em 0 #fff,-.05em -.05em 0 #fff,
  0 .12em 0 var(--ring),0 -.12em 0 var(--ring),.12em 0 0 var(--ring),-.12em 0 0 var(--ring),.09em .09em 0 var(--ring),-.09em .09em 0 var(--ring),.09em -.09em 0 var(--ring),-.09em -.09em 0 var(--ring)}
.cfoot{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-family:var(--f-hand);font-size:14px;line-height:1.4}
.cfoot .cnt{background:var(--ring);color:#fff;border-radius:999px;padding:1px 10px;font-family:var(--f-ui);font-size:13px;font-weight:500}

/* paper */
.pages{display:flex;flex-direction:column;gap:28px;align-items:center}
.paper{--m:72px;box-sizing:border-box;width:100%;max-width:794px;position:relative;background-color:var(--paper);color:var(--ink);background-image:linear-gradient(to left, transparent var(--m), var(--margin) var(--m), var(--margin) calc(var(--m) + 2px), transparent calc(var(--m) + 2px)),repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);font-family:var(--f-hand);font-size:16.5px;line-height:32px;padding:32px calc(var(--m) + 20px) 48px 28px;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 28px rgba(20,30,50,.16)}
.paper p,.paper h2,.paper h3,.paper ul{margin:0}
.paper .pg{position:absolute;left:24px;bottom:10px;font-size:13px;color:#8a8a9a}
.ttl{display:flex;justify-content:center;padding-block:16px}
.ttl span{font-family:var(--f-title);font-size:56px;line-height:64px;background:var(--hl-tan);padding:0 24px;border-radius:6px;transform:rotate(-1deg);text-align:center}
.paper h2{font-family:var(--f-title);font-size:36px;line-height:64px}
.paper h2 span{padding:0 12px;border-radius:5px}
.y{background:var(--hl-y);border-radius:4px;padding:0 3px}.p{background:var(--hl-p);border-radius:4px;padding:0 3px}.b{background:var(--hl-b);border-radius:4px;padding:0 3px}.g{background:var(--hl-g);border-radius:4px;padding:0 3px}
.u{text-decoration:underline;text-decoration-color:var(--pen-pink);text-decoration-thickness:2px;text-underline-offset:5px}
.warn{color:#c23b3b}
.fig{display:flex;justify-content:center;padding-block:8px}
.fig svg{width:100%;max-width:520px;height:auto}
.formula{display:flex;justify-content:center;padding-block:16px}
.formula span{direction:ltr;font-size:21px;border:2px solid var(--pen-pink);border-radius:10px;padding:0 22px;background:#fff}
.mode{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start}
.mode>div{flex:1 1 300px;min-width:0}
.mode svg{flex:none;width:200px;max-width:100%;height:auto;margin-top:48px}
.tbl{overflow-x:auto;padding-block:8px}
.tbl table{border-collapse:collapse;width:100%;min-width:460px;font-size:15px}
.tbl th,.tbl td{border:1.5px solid var(--ink);padding:0 8px;line-height:32px;text-align:right;vertical-align:top}
.tbl th{background:var(--hl-y)}
.tip{display:flex;justify-content:center;padding-block:24px 8px}
.tip div{border:2px dashed var(--pen-pink);border-radius:12px;padding:0 18px;background:#fff;text-align:center}

/* contents page */
.toc{list-style:none;padding:0;margin:0}
.toc button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:8px;align-items:baseline;width:100%;min-height:32px;line-height:32px}
.toc button:hover .name{background:var(--hl-y)}
.toc button:focus-visible{outline:3px solid var(--focus)}
.toc .name{border-radius:4px;padding:0 3px}
.toc .dots{flex:1;border-bottom:2px dotted #9aa3b5;transform:translateY(-8px)}
.toc .pp{color:#6b6b80}

@media (max-width:560px){
  .paper{--m:40px;font-size:15.5px;padding-left:16px;padding-right:calc(var(--m) + 12px)}
  .ttl span{font-size:44px}
  .top h1{font-size:46px}
}
@media (prefers-reduced-motion: reduce){ .cover{transition:none} .cover:hover{transform:none} }

/* app shell: full-bleed body, room for the iPhone notch/status bar, no grey tap flash */
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;-webkit-tap-highlight-color:transparent}
.back[hidden]{display:none}

/* squared paper (math / electricity): grid instead of lines, cover and pages alike */
.cover.grid{background-image:repeating-linear-gradient(to bottom, transparent 0 17px, #d6dde8 17px 18px),repeating-linear-gradient(to left, transparent 0 17px, #d6dde8 17px 18px)}
.pages.grid .paper{background-image:linear-gradient(to left, transparent var(--m), var(--margin) var(--m), var(--margin) calc(var(--m) + 2px), transparent calc(var(--m) + 2px)),repeating-linear-gradient(to bottom, transparent 0 15px, var(--rule) 15px 16px),repeating-linear-gradient(to left, transparent 0 15px, var(--rule) 15px 16px)}
.wrap{padding-top:max(28px, calc(env(safe-area-inset-top, 0px) + 12px));padding-bottom:max(64px, calc(env(safe-area-inset-bottom, 0px) + 24px))}

/* header buttons, "add topic" on the contents page, actions under a topic */
.hbtns{display:flex;gap:8px;align-items:center}
.gear{padding:10px 14px}
.addtopic{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:32px;line-height:32px;color:var(--pen-pink);font-weight:600}
.addtopic:hover span{background:var(--hl-p);border-radius:4px}
.addtopic:focus-visible{outline:3px solid var(--focus)}
.tactions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:794px}
.tactions button,.sheet .btn{display:inline-flex;align-items:center;gap:6px;background:var(--desk-2);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px}
.tactions button:hover,.sheet .btn:hover{border-color:var(--muted)}
.sheet .btn.primary{background:var(--pen-pink);border-color:var(--pen-pink);color:#fff}
.sheet .btn:disabled{opacity:.55;cursor:default}

/* full-screen sheets: chat with Claude, settings */
.sheet{position:fixed;inset:0;z-index:20;background:var(--desk);color:var(--fg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
.sheet[hidden]{display:none}
.shead{display:flex;align-items:center;gap:12px;padding:12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));border-bottom:1px solid var(--line)}
.shead b{flex:1;font-size:18px}
.shead button{background:none;border:1px solid var(--line);border-radius:999px;min-width:44px;min-height:44px;cursor:pointer}
.slog{flex:1;overflow-y:auto;padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.msg{max-width:min(640px, 88%);padding:10px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-start;background:var(--pen-pink);color:#fff;border-end-start-radius:4px}
.msg.ai{align-self:flex-end;background:var(--desk-2);border:1px solid var(--line);border-end-end-radius:4px}
.msg.note{align-self:center;background:none;color:var(--muted);font-size:14px;padding:4px}
.msg.err{align-self:center;color:#c23b3b;background:none;font-size:15px;text-align:center}
.msg img{display:block;max-width:180px;max-height:180px;border-radius:8px;margin-bottom:6px}
.prop{align-self:stretch;display:flex;flex-direction:column;gap:12px;align-items:center;border:2px dashed var(--pen-pink);border-radius:16px;padding:12px}
.prop .pages{width:100%;gap:16px}
.prop .ptitle{font-weight:700}
.sfiles{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px}
.sfiles span{background:var(--desk-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;cursor:pointer}
.sform{display:flex;gap:8px;align-items:flex-end;padding:10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));border-top:1px solid var(--line)}
.sform textarea{flex:1;font:inherit;font-size:16px;resize:none;max-height:40vh;min-height:44px;padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:var(--desk-2);color:var(--fg)}
.sform .icon{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--desk-2);cursor:pointer;font-size:20px}
.sform .send{background:var(--pen-pink);border-color:var(--pen-pink);color:#fff}
.sform .send:disabled{opacity:.5}
.sbody{flex:1;overflow-y:auto;padding:20px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px;max-width:640px;width:100%;box-sizing:border-box;margin-inline:auto}
.sbody label{display:flex;flex-direction:column;gap:6px;font-weight:500}
.sbody input,.sbody textarea{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--desk-2);color:var(--fg);direction:ltr;text-align:left}
.sbody small{color:var(--muted);font-weight:400}
.sbody .row{display:flex;gap:10px;flex-wrap:wrap}
.sbody .status{min-height:1.5em}
.sbody input.rtl{direction:rtl;text-align:right}

/* big buttons under the shelf / contents page */
.bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}
.bigbtn{display:inline-flex;align-items:center;gap:8px;font-size:18px;font-weight:700;padding:14px 26px;min-height:52px;border-radius:999px;cursor:pointer;background:var(--pen-pink);color:#fff;border:none;box-shadow:0 6px 16px rgba(224,98,143,.35)}
.bigbtn:hover{filter:brightness(1.05)}
.bigbtn.quiet{background:var(--desk-2);color:var(--fg);border:1px solid var(--line);box-shadow:none;font-weight:500;font-size:16px}
.shelf.one{grid-template-columns:minmax(0, 260px);justify-content:center}

/* exam: setup steps */
.ebody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.qhead{margin:0;font-size:22px}
.choice{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--desk-2)}
.choice b{font-size:20px}
.choice span{color:var(--muted)}
.choice:hover,.choice:focus-visible{border-color:var(--pen-pink);outline:none}
.ptable table{min-width:0;color:var(--fg)}
.ptable th,.ptable td{border-color:var(--line);line-height:1.6;padding:6px 10px}
.ptable th{background:var(--desk-2)}
.ptable input{width:20px;height:20px}
.sbody .range label{flex:1 1 90px}
.sbody .range input{direction:ltr;text-align:center}

/* exam paper: looks like a printed school exam */
.examwrap{display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px max(12px, env(safe-area-inset-right, 0px)) 40px max(12px, env(safe-area-inset-left, 0px))}
.exam-paper{box-sizing:border-box;width:100%;max-width:794px;background:#fff;color:#111;font-family:'Rubik', Arial, sans-serif;font-size:17px;line-height:1.6;padding:28px clamp(16px, 5vw, 56px) 40px;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.1),0 12px 28px rgba(20,30,50,.18)}
.exam-paper .ehead{display:flex;justify-content:space-between;gap:16px;font-weight:700;margin-bottom:22px}
.exam-paper .blank{display:inline-block;min-width:110px;border-bottom:2px solid #111;text-align:center;vertical-align:bottom;min-height:1.4em}
.exam-paper h1{font-size:22px;text-align:center;text-decoration:underline;text-underline-offset:6px;margin:0 0 12px;text-wrap:balance}
.exam-paper .intro{font-weight:700;margin:0 0 18px}
.exam-paper h2{font-size:18px;margin:26px 0 4px}
.exam-paper .instr{font-weight:700;margin:0 0 14px}
.exam-paper .q{margin:0 0 22px;padding:4px 0}
.exam-paper .qt{margin:0 0 8px;font-weight:700}
.exam-paper .mark{margin-inline-start:10px}
.opts{display:flex;flex-direction:column;gap:4px;padding-inline-start:22px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;padding:4px 6px;border-radius:8px;min-height:40px}
.opt:hover{background:#f3f5f8}
.opt .let{flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2px solid transparent;font-weight:700}
.opt .let::after{content:"."}
.opt.on .let{border-color:#1f4fbf;color:#1f4fbf}
.opt.right{background:#e3f6e1}
.opt:focus-visible{outline:3px solid var(--focus)}
.exam-paper textarea.ans{box-sizing:border-box;width:100%;font:inherit;font-size:16px;color:#1f3b8c;line-height:32px;padding:0 8px;border:none;border-radius:0;resize:vertical;min-height:130px;background:repeating-linear-gradient(to bottom, transparent 0 31px, #222 31px 32px);outline:none}
.exam-paper textarea.ans:focus{background-color:#fbfcff}
.syms{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.syms[hidden]{display:none}
.syms button{min-width:40px;min-height:40px;border-radius:8px;border:1px solid #c9d1dc;background:#f6f8fb;color:#111;font-size:17px;cursor:pointer}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tools button,.tools label{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #c9d1dc;background:#f6f8fb;color:#111;font-size:15px;cursor:pointer}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{position:relative}
.thumb img{display:block;width:120px;height:90px;object-fit:cover;border-radius:6px;border:1px solid #c9d1dc}
.thumb button{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;border:none;background:#d23a3a;color:#fff;cursor:pointer}
.exam-paper .good{text-align:center;font-weight:700;font-size:20px;margin-top:30px}
.btn.big{font-size:18px;padding:14px 30px}
/* graded: red teacher's pen */
.pen{font-family:var(--f-hand);color:#d23a3a;font-weight:600}
.pen.big{font-size:30px;line-height:1}
.exam-paper .fb{margin:8px 0 0;font-size:15px}
.exam-paper .model summary{cursor:pointer;color:#555;font-size:15px;margin-top:6px}
.exam-paper .model p{margin:4px 0 0;font-size:15px;color:#333;background:#f6f8fb;border-radius:8px;padding:8px 12px;white-space:pre-wrap}
.q.done.correct .qt b{color:#2f8a3a}
.q.done.wrong .qt b{color:#d23a3a}
.q.done.wrong .opt.on .let{border-color:#d23a3a;color:#d23a3a}
.summary{width:100%;max-width:794px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.summary .grade{font-family:var(--f-hand);font-size:56px;font-weight:600;color:#d23a3a;width:110px;height:110px;border:4px solid #d23a3a;border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg)}
.summary p{margin:0}

/* drawing pad */
.draw{background:#fff;color:#111}
.dtools{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-bottom:1px solid #dde3ea}
.dtools button{display:inline-flex;align-items:center;gap:6px;min-width:44px;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid #c9d1dc;background:#f6f8fb;color:#111;cursor:pointer;font-size:15px}
.dtools button.on{border:2px solid #e0628f}
.dtools i{display:block;width:20px;height:20px;border-radius:50%}
#drawCanvas{flex:1;width:100%;min-height:0;touch-action:none;background-color:#fff;background-image:linear-gradient(#dde5ef 1px, transparent 1px),linear-gradient(90deg, #dde5ef 1px, transparent 1px);background-size:20px 20px;cursor:crosshair}
.dfoot{padding:10px 12px;border-top:1px solid #dde3ea;display:flex;gap:10px}
.dfoot .btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #c9d1dc;background:#f6f8fb;color:#111;cursor:pointer}
.dfoot .btn.primary{background:var(--pen-pink);border-color:var(--pen-pink);color:#fff}
</style>
</head>
<body>

<div class="wrap" dir="rtl" lang="he">
  <header class="top">
    <div>
      <h1 id="hTitle">המחברות שלי</h1>
      <p id="hSub" class="crumbs">בחרו מחברת כדי לפתוח אותה</p>
    </div>
    <div class="hbtns">
      <button class="back" id="backBtn" type="button" hidden>→ <span id="backTxt">חזרה</span></button>
      <button class="back gear" id="gearBtn" type="button" aria-label="הגדרות">⚙️</button>
    </div>
  </header>
  <main id="view"></main>

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const k in (attrs||{})) { if (k === 'class') n.className = attrs[k]; else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]); else n.setAttribute(k, attrs[k]); }
  kids.flat().forEach(c => n.append(c));
  return n;
}

/* bubble letters like a hand-drawn notebook title: colored outer ring, white gap, dark outline, colored fill */
function bubbleSvg(text, fill, ring, opts = {}){
  const lines = opts.oneLine ? [text] : text.split(' ');
  const maxLen = Math.max(...lines.map(l => l.length));
  const fs = opts.fs || Math.min(70, 286 / (maxLen * 0.66 + 0.45));
  const W = opts.fixedW || Math.round(maxLen * fs * 0.66 + fs * 0.45 + 10);
  const lh = fs * 1.04, pad = fs * 0.22;
  let out = '';
  lines.forEach((l, i) => {
    const y = (pad + fs * 0.84 + i * lh).toFixed(1);
    const t = extra => `<text x="${W/2}" y="${y}" text-anchor="middle" direction="rtl" font-family="Rubik, 'Arial Black', sans-serif" font-weight="900" font-size="${fs.toFixed(1)}" stroke-linejoin="round" stroke-linecap="round" ${extra}>${l}</text>`;
    out += t(`fill="${ring}" stroke="${ring}" stroke-width="${(fs*0.36).toFixed(1)}"`) +
           t(`fill="#ffffff" stroke="#ffffff" stroke-width="${(fs*0.23).toFixed(1)}"`) +
           t(`fill="${fill}" stroke="${O}" stroke-width="${(fs*0.1).toFixed(1)}"`) +
           t(`fill="${fill}"`);
  });
  const H = Math.round(pad * 2 + fs * 0.9 + (lines.length - 1) * lh + fs * 0.12);
  const d = document.createElement('div');
  d.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${text}">${out}</svg>`;
  return d.firstChild;
}
function setHeader(text){ hTitle.replaceChildren(bubbleSvg(text, '#ffd9e6', '#d94f84', {oneLine:true, fs:60})); }

}

const AI = window.NBAI || null;

function allNotebooks(){ return NOTEBOOKS.concat(DATA.notebooks.map(n => ({...n, topics:[], custom:true}))); }
function artFor(nb){
  if (!nb.custom) return ART[nb.art](nb.ring);
  return { top: AI.sanitizeSvg(nb.top) + bTop(nb.ring), bot: AI.sanitizeSvg(nb.bot) + bBot(nb.ring) };
}
function topicsOf(nb){ return nb.topics.concat(DATA.topics.filter(t => t.notebook === nb.id)); }
function pageCount(t){
  if (t.html) return t.pageCount || 1;
  const tpl = document.getElementById('t-' + t.id);
  return (tpl && tpl.content.querySelectorAll('article').length) || 1;
}
function firstPage(nb, t){ let p = 1; for (const x of topicsOf(nb)) { if (x === t) break; p += pageCount(x); } return p; }

function showNotebook(nb){
  setHeader(nb.title);
  hSub.textContent = 'המחברות שלי › ' + nb.title;
  setBack('כל המחברות', showShelf); setHash(nb.id);
  rerender = () => showNotebook(nb);
  const all = topicsOf(nb);
  const list = el('ul', {class:'toc'});
  all.forEach((t, i) => {
    const a = firstPage(nb, t), b = a + pageCount(t) - 1;
    list.append(el('li', {}, el('button', {type:'button', onclick:() => showTopic(nb, t)},
      el('span', {class:'name'}, (i+1) + '. ' + t.title), el('span', {class:'dots', 'aria-hidden':'true'}), el('span', {class:'pp'}, 'עמ׳ ' + (a === b ? a : a + '–' + b)))));
  });
  const paper = el('article', {class:'paper'},
    el('div', {class:'ttl'}, bubbleSvg('תוכן עניינים', nb.fill, nb.ring, {oneLine:true, fs:60})),
    el('p', {}, 'מחברת: ', el('span', {class:'y'}, nb.title)),
    el('p', {}, ' '), all.length ? list : el('p', {}, 'עדיין אין נושאים במחברת הזאת – הם יופיעו כאן.'),
    el('p', {}, ' '),
    el('button', {class:'addtopic', type:'button', onclick:() => openChat(nb)}, '＋ ', el('span', {}, 'נושא חדש עם Claude')));
  const bar = el('div', {class:'bar'}, el('button', {class:'bigbtn', type:'button', onclick:() => openExam(nb)}, '📝 התחלת מבחן'));
  if (nb.custom) bar.append(el('button', {class:'bigbtn quiet', type:'button', onclick:() => deleteNotebook(nb)}, '🗑 מחיקת המחברת'));
  view.replaceChildren(el('div', {class:'pages' + (nb.paper === 'grid' ? ' grid' : ''), style:`--hl-tan:${nb.fill}`}, paper, bar));
  window.scrollTo(0,0);
}

async function deleteNotebook(nb){
  const n = topicsOf(nb).length;
  if (!confirm('למחוק את המחברת "' + nb.title + '"' + (n ? ' ואת ' + n + ' הנושאים שבה' : '') + '?')) return;
  try { DATA = await AI.store.removeNotebook(nb.id); showShelf(); }
  catch (e) { alert(e.message); }
}

function topicPages(nb, t){
  const frag = document.createDocumentFragment();
  if (t.html) {
    const d = document.createElement('div');
    d.innerHTML = AI ? AI.sanitize(t.html) : '';
    let p = firstPage(nb, t);
    d.querySelectorAll('article.paper').forEach(a => { a.querySelectorAll('.pg').forEach(x => x.remove()); a.append(el('span', {class:'pg'}, 'עמוד ' + p++)); });
    frag.append(...d.childNodes);
  } else {
    const tpl = document.getElementById('t-' + t.id);
    if (tpl) frag.append(tpl.content.cloneNode(true));
  }
  return frag;
}

function showTopic(nb, t){
  setHeader(t.title);
  hSub.textContent = 'המחברות שלי › ' + nb.title + ' › ' + t.title;
  setBack('לתוכן העניינים', () => showNotebook(nb)); setHash(t.id);
  rerender = () => { const fresh = topicsOf(nb).find(x => x.id === t.id); fresh ? showTopic(nb, fresh) : showNotebook(nb); };
  const wrap = el('div', {class:'pages' + (nb.paper === 'grid' ? ' grid' : '')}, topicPages(nb, t));
  if (t.html) wrap.append(el('div', {class:'tactions'},
    el('button', {type:'button', onclick:() => openChat(nb, t)}, '✏️ שינוי עם Claude'),
    el('button', {type:'button', onclick:() => deleteTopic(nb, t)}, '🗑 מחיקת הנושא')));
  view.replaceChildren(wrap);
  window.scrollTo(0,0);
}

async function deleteTopic(nb, t){
  if (!confirm('למחוק את הנושא "' + t.title + '"?')) return;
  try { DATA = await AI.store.removeTopic(t.id); showNotebook(nb); }
  catch (e) { alert(e.message); }
}

const chat = document.getElementById('chat'), chatLog = document.getElementById('chatLog'), chatForm = document.getElementById('chatForm');

let session = null, chatNb = null, chatTopic = null, files = [], busy = false;

function logMsg(cls, ...kids){ const m = el('div', {class:'msg ' + cls}, ...kids); chatLog.append(m); chatLog.scrollTop = chatLog.scrollHeight; return m; }
function showFiles(){ chatFiles.replaceChildren(...files.map((f, i) => el('span', {title:'הסרה', onclick:() => { files.splice(i, 1); showFiles(); }}, '📎 ' + f.name + ' ✕'))); }

function openChat(nb, topic){
  if (!AI) return alert('הצ׳אט לא נטען. בדקו חיבור לאינטרנט.');
  chatNb = nb; chatTopic = topic || null; files = []; showFiles();
  const tpl = document.getElementById('t-transformer');
  session = new AI.ChatSession({ notebookTitle: nb.title, exampleHtml: tpl ? tpl.innerHTML.trim() : '', existing: topic ? {title: topic.title, html: topic.html} : null });
  document.getElementById('chatTitle').textContent = topic ? 'שינוי: ' + topic.title : 'נושא חדש · ' + nb.title;
  chatLog.replaceChildren();
  logMsg('ai', topic
    ? 'מה לשנות ב"' + topic.title + '"? אפשר לבקש להוסיף, לקצר, לתקן או להוסיף שרטוט.'
    : 'היי! על איזה נושא נכין דף ב' + nb.title + '?\nאפשר לכתוב את החומר, להדביק סיכום, או לצלם דפים מהמחברת 📷 ואני אסדר הכול בסגנון המחברת.');
  if (!AI.settings.get().anthropicKey) logMsg('err', 'קודם צריך להגדיר מפתח API ב⚙️ הגדרות.');
  chat.hidden = false;
  chatText.focus();
}
document.getElementById('chatClose').addEventListener('click', () => {
  if (busy && !confirm('Claude עדיין כותב. לסגור בכל זאת?')) return;
  chat.hidden = true; session = null; rerender();
});
chatFile.addEventListener('change', () => { files.push(...chatFile.files); chatFile.value = ''; showFiles(); });
chatText.addEventListener('input', () => { chatText.style.height = 'auto'; chatText.style.height = chatText.scrollHeight + 'px'; });
chatText.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); chatForm.requestSubmit(); } });

chatForm.addEventListener('submit', async e => {
  e.preventDefault();
  if (busy || !session) return;
  const text = chatText.value, sent = files.slice();
  if (!text.trim() && !sent.length) return;
  const me = logMsg('me');
  for (const f of sent) if (f.type.startsWith('image/')) me.append(el('img', {src: URL.createObjectURL(f), alt: ''})); else me.append('📎 ' + f.name + '\n');
  me.append(text);
  chatText.value = ''; chatText.style.height = 'auto'; files = []; showFiles();
  await converse(s => session.send(text, sent, s));
});

async function converse(start){
  busy = true; chatSend.disabled = true;
  const mySession = session;
  let bubble = null, status = logMsg('note', 'Claude חושב…');
  await start(ev => {
    if (session !== mySession) return; // chat was closed meanwhile
    if (ev.type === 'text') {
      if (!bubble) { bubble = logMsg('ai'); chatLog.append(status); }
      bubble.textContent += ev.text; chatLog.scrollTop = chatLog.scrollHeight;
    } else if (ev.type === 'writing') {
      status.textContent = '✍️ כותב את הדפים… (' + ev.chars.toLocaleString('he-IL') + ' תווים)';
    } else if (ev.type === 'proposal') {
      showProposal(ev.title, ev.html);
    } else if (ev.type === 'error') {
      const m = logMsg('err', ev.message);
      if (ev.retryable) m.append(' ', el('button', {class:'btn', type:'button', onclick:() => { m.remove(); converse(s => session.retry(s)); }}, 'לנסות שוב'));
    }
  });
  status.remove();
  busy = false; chatSend.disabled = false;
}

function showProposal(title, html){
  const pages = el('div', {class:'pages' + (chatNb.paper === 'grid' ? ' grid' : '')});
  pages.innerHTML = html;
  const add = el('button', {class:'btn primary', type:'button'}, chatTopic ? '💾 שמירת השינויים' : '➕ הוספה למחברת');
  add.addEventListener('click', async () => {
    add.disabled = true; add.textContent = 'שומר…';
    const topic = { id: chatTopic ? chatTopic.id : 'u' + Date.now().toString(36), notebook: chatNb.id, title, html,
      pageCount: Math.max(1, pages.querySelectorAll('article.paper').length), created: chatTopic ? chatTopic.created : new Date().toISOString(), updated: new Date().toISOString() };
    try {
      DATA = await AI.store.saveTopic(topic);
      chat.hidden = true; session = null;
      showTopic(chatNb, DATA.topics.find(t => t.id === topic.id) || topic);
    } catch (err) {
      add.disabled = false; add.textContent = chatTopic ? '💾 שמירת השינויים' : '➕ הוספה למחברת';
      logMsg('err', err.message);
    }
  });
  const box = el('div', {class:'prop'}, el('div', {class:'ptitle'}, '📒 ' + title), pages, add, el('div', {class:'msg note'}, 'רוצים לשנות משהו? פשוט כתבו לי.'));
  chatLog.append(box);
  box.scrollIntoView({block:'start'});
}

  try { await navigator.clipboard.writeText(code); setStatus.textContent = '✓ הועתק. שלחו את הקוד לטלפון והדביקו אותו שם בהגדרות.'; }
  catch { document.execCommand('copy'); setStatus.textContent = 'סמנו והעתיקו את הקוד מהשדה למעלה.'; }
});

/* ===== new notebook: Claude designs the cover from the subject ===== */

function openNewNotebook(){

/* ===== exams: choose type and pages, Claude writes the questions, grades the open answers ===== */
const examSheet = document.getElementById('exam'), examBody = document.getElementById('examBody'), examTitle = document.getElementById('examTitle');
let examState = null;
const LETTERS = ['א', 'ב', 'ג', 'ד'];
const MODES = { open: 'מילולי', mc: 'אמריקאי', both: 'גם וגם' };
const SYMBOLS = ['²', '³', '√', 'π', '±', '·', '÷', '≠', '≤', '≥', '≈', '∞', '°', 'Ω', 'Δ', 'α', 'θ', 'λ', '½', '→', '∑', '∫', 'x̄'];

// every notebook page as plain text, with its page number and topic
function pageTexts(nb){
  const out = [];
  for (const t of topicsOf(nb)) {
    const box = el('div', {}, topicPages(nb, t));
    let p = firstPage(nb, t);
    box.querySelectorAll('article').forEach(a => {
      a.querySelectorAll('.pg').forEach(x => x.remove());
      a.querySelectorAll('p,h2,h3,tr,li,.ttl,.formula,.tip,text').forEach(x => x.append('\n'));
      out.push({ page: p++, topic: t.title, text: a.textContent.replace(/[ \t]+/g, ' ').replace(/\n\s*\n+/g, '\n').trim() });
    });
  }
  return out;
}

function openExam(nb){
  if (!AI) return alert('לא נטען. בדקו חיבור לאינטרנט.');
  if (!topicsOf(nb).length) return alert('אין עדיין נושאים במחברת הזאת. הוסיפו נושא ואז אפשר להיבחן.');
  examState = { nb };
  examTitle.textContent = 'מבחן · ' + nb.title;
  examStepMode();
  examSheet.hidden = false;
}
document.getElementById('examClose').addEventListener('click', () => {
  if (examState && examState.exam && !examState.graded && !confirm('לצאת מהמבחן? התשובות לא יישמרו.')) return;
  examSheet.hidden = true; examState = null;
});

function examStepMode(){
  const card = (mode, icon, desc) => el('button', {class:'choice', type:'button', onclick:() => { examState.mode = mode; examStepPages(); }}, el('b', {}, icon + ' ' + MODES[mode]), el('span', {}, desc));
  examBody.replaceChildren(el('div', {class:'sbody'},
    el('h2', {class:'qhead'}, 'איזה סוג מבחן?'),
    card('open', '✍️', 'שאלות פתוחות. Claude בודק את התשובות: נכון = ניקוד מלא, קרוב = חצי, לא נכון = 0'),
    card('mc', '🔘', 'שאלות עם 4 תשובות: א, ב, ג, ד'),
    card('both', '📋', 'חלק ראשון אמריקאי, חלק שני שאלות פתוחות')));
}

function examStepPages(){
  const nb = examState.nb, pages = pageTexts(nb), last = pages.length;
  const topics = topicsOf(nb).map(t => ({ title: t.title, from: firstPage(nb, t), to: firstPage(nb, t) + pageCount(t) - 1 }));
  const from = el('input', {type:'number', min:1, max:last, value:1, inputmode:'numeric'});
  const to = el('input', {type:'number', min:1, max:last, value:last, inputmode:'numeric'});
  const count = el('input', {type:'number', min:2, max:30, inputmode:'numeric', placeholder:'אוטומטי'});
  const info = el('p', {class:'status'});
  const checks = topics.map(t => el('input', {type:'checkbox', checked:''}));
  const sel = () => {
    const a = Math.max(1, +from.value || 1), b = Math.min(last, +to.value || last);
    return pages.filter(p => p.page >= a && p.page <= b && checks[topics.findIndex(t => p.page >= t.from && p.page <= t.to)].checked);
  };
  // empty = Claude reads the pages and sizes the exam to the material (up to 30)
  const chosen = () => count.value.trim() ? Math.min(30, Math.max(2, Math.round(+count.value) || 2)) : null;
  let touched = false;
  const update = () => {
    const a = +from.value || 1, b = +to.value || last;
    topics.forEach((t, i) => { if (!touched) checks[i].checked = t.to >= a && t.from <= b; });
    const s = sel(), c = chosen();
    info.textContent = !s.length ? 'לא נבחרו עמודים.'
      : `נבחרו ${s.length} עמודים מתוך ${last}. ` + (c ? `יורכבו ${c} שאלות.` : 'Claude יקרא את כל העמודים ויקבע כמה שאלות לפי החומר (עד 30), בערך 2 על כל דבר שנלמד.');
  };
  [from, to].forEach(x => x.addEventListener('input', () => { touched = false; update(); }));
  checks.forEach(c => c.addEventListener('change', () => { touched = true; update(); }));
  count.addEventListener('input', update);
  const go = el('button', {class:'btn primary', type:'button', onclick:() => {
    const s = sel(); if (!s.length) return;
    examGenerate(s, chosen());
  }}, '🚀 התחלת המבחן');
  examBody.replaceChildren(el('div', {class:'sbody'},
    el('h2', {class:'qhead'}, 'על מה המבחן? (' + MODES[examState.mode] + ')'),
    el('div', {class:'tbl ptable'}, el('table', {},
      el('tr', {}, el('th', {}, ''), el('th', {}, 'נושא'), el('th', {}, 'עמודים')),
      ...topics.map((t, i) => el('tr', {}, el('td', {}, checks[i]), el('td', {}, t.title), el('td', {}, t.from === t.to ? String(t.from) : t.from + '–' + t.to))))),
    el('div', {class:'row range'}, el('label', {}, 'מעמוד', from), el('label', {}, 'עד עמוד', to), el('label', {}, 'מספר שאלות', count)),
    info,
    el('div', {class:'row'}, go, el('button', {class:'btn', type:'button', onclick:examStepMode}, '→ חזרה'))));
  update();
}

async function examGenerate(selPages, count){
  const nb = examState.nb;
  const status = el('p', {class:'status'}, '📝 Claude מרכיב את המבחן…');
  examBody.replaceChildren(el('div', {class:'sbody'}, el('h2', {class:'qhead'}, 'מכין מבחן'), status));
  const material = selPages.map(p => `--- עמוד ${p.page} | נושא: ${p.topic} ---\n${p.text}`).join('\n\n');
  try {
    const exam = await AI.makeExam({ notebookTitle: nb.title, mode: examState.mode, material, count }, n => { status.textContent = '📝 Claude מרכיב את המבחן… (' + n.toLocaleString('he-IL') + ' תווים)'; });
    if (examState && examState.nb === nb) { examState.exam = exam; examState.topics = [...new Set(selPages.map(p => p.topic))]; renderExam(); }
  } catch (e) {
    examBody.replaceChildren(el('div', {class:'sbody'}, el('p', {class:'msg err'}, e.message),
      el('div', {class:'row'}, el('button', {class:'btn primary', type:'button', onclick:() => examGenerate(selPages, count)}, 'לנסות שוב'), el('button', {class:'btn', type:'button', onclick:examStepPages}, '→ חזרה'))));
  }
}

const fmt = n => (Math.round(n * 10) / 10).toLocaleString('he-IL');

function renderExam(){
  const { nb, exam } = examState;
  const qs = exam.questions, per = 100 / qs.length;
  const mcs = qs.filter(q => q.type === 'mc'), opens = qs.filter(q => q.type === 'open');
  const parts = [mcs.length && 'mc', opens.length && 'open'].filter(Boolean);
  const ordinal = ['ראשון', 'שני'];
  examState.answers = qs.map(() => ({ choice: -1, text: '', images: [] }));
  examState.graded = false;
  const score = el('span', {class:'blank score'});
  const paper = el('article', {class:'exam-paper'},
    el('div', {class:'ehead'}, el('span', {}, 'שם: ', el('span', {class:'blank'}, '')), el('span', {}, 'ציון: ', score)),
    el('h1', {}, exam.title || ('מבחן ב' + nb.title)),
    el('p', {class:'intro'}, `לפניכם מבחן ב${nb.title} בן ${parts.length === 2 ? 'שני חלקים' : 'חלק אחד'}, בנושא${examState.topics.length > 1 ? 'ים' : ''}: ${examState.topics.join(', ')}. קראו את ההוראות היטב ותוכלו להתמודד עם כל אתגר וקושי. בהצלחה.`));
  let num = 0;
  parts.forEach((part, pi) => {
    const list = part === 'mc' ? mcs : opens;
    paper.append(el('h2', {}, '• ', el('u', {}, `חלק ${ordinal[pi]}:`), part === 'mc' ? ' שאלון מרובה תשובות (שאלון אמריקאי)' : ' שאלות פתוחות'),
      el('p', {class:'instr'}, (part === 'mc' ? 'סמנו בעיגול את התשובה הנכונה. ' : 'ענו על כל השאלות. אפשר לצרף ציור ✏️ או צילום 📷 של פתרון בכתב יד. ')
        + `כל ${part === 'mc' ? 'תשובה נכונה' : 'שאלה'} ${fmt(per)} נק' (${fmt(per * list.length)} נק' סה"כ).`));
    list.forEach(q => {
      const i = qs.indexOf(q), n = ++num, box = el('div', {class:'q', 'data-i': i});
      box.append(el('p', {class:'qt'}, el('b', {}, n + '. '), q.question, el('span', {class:'mark'})));
      if (q.type === 'mc') {
        const ol = el('div', {class:'opts'});
        q.options.forEach((o, k) => ol.append(el('button', {class:'opt', type:'button', onclick:e => {
          if (examState.graded) return;
          examState.answers[i].choice = k;
          ol.querySelectorAll('.opt').forEach((b, j) => b.classList.toggle('on', j === k));
        }}, el('span', {class:'let'}, LETTERS[k]), el('span', {}, o))));
        box.append(ol);
      } else {
        const ta = el('textarea', {class:'ans', rows: q.drawing ? 4 : 5, placeholder:'כתבו כאן את התשובה…'});
        ta.addEventListener('input', () => { examState.answers[i].text = ta.value; });
        const thumbs = el('div', {class:'thumbs'});
        const showThumbs = () => thumbs.replaceChildren(...examState.answers[i].images.map((src, k) => el('span', {class:'thumb'}, el('img', {src, alt:'מצורף'}),
          el('button', {type:'button', 'aria-label':'הסרה', onclick:() => { if (examState.graded) return; examState.answers[i].images.splice(k, 1); showThumbs(); }}, '✕'))));
        const photo = el('input', {type:'file', accept:'image/*', hidden:''});
        photo.addEventListener('change', async () => { for (const f of photo.files) examState.answers[i].images.push(await AI.photoToDataUrl(f)); photo.value = ''; showThumbs(); });
        const symbols = el('div', {class:'syms'},
          ...SYMBOLS.map(s => el('button', {type:'button', onclick:() => { const a = ta.selectionStart ?? ta.value.length; ta.setRangeText(s, a, ta.selectionEnd ?? a, 'end'); ta.focus(); examState.answers[i].text = ta.value; }}, s)));
        symbols.hidden = !(nb.paper === 'grid' || q.drawing);
        const tools = el('div', {class:'tools'},
          el('button', {type:'button', onclick:() => openDraw(src => { examState.answers[i].images.push(src); showThumbs(); })}, '✏️ ציור / שרטוט'),
          el('label', {}, '📷 צילום תשובה', photo),
          el('button', {type:'button', onclick:() => { symbols.hidden = !symbols.hidden; }}, '∑ סימנים'));
        box.append(ta, symbols, tools, thumbs);
      }
      paper.append(box);
    });
  });
  paper.append(el('p', {class:'good'}, 'בהצלחה!'));
  const submit = el('button', {class:'btn primary big', type:'button', onclick:() => gradeExam(paper, score, submit)}, '📤 הגשת המבחן');
  examBody.replaceChildren(el('div', {class:'examwrap'}, paper, submit));
  examBody.scrollTop = 0;
}

async function gradeExam(paper, scoreEl, submit){
  const { exam, answers } = examState, qs = exam.questions, per = 100 / qs.length;
  const unanswered = qs.filter((q, i) => q.type === 'mc' ? answers[i].choice < 0 : !answers[i].text.trim() && !answers[i].images.length).length;
  if (unanswered && !confirm(`יש ${unanswered} שאלות בלי תשובה. להגיש בכל זאת?`)) return;
  submit.disabled = true; submit.textContent = '⏳ בודק את המבחן…';
  const results = qs.map(() => null);
  qs.forEach((q, i) => { if (q.type === 'mc') results[i] = { verdict: answers[i].choice === q.correct ? 'correct' : 'wrong', feedback: q.answer }; });
  const open = qs.map((q, i) => ({ q, i })).filter(x => x.q.type === 'open');
  const toGrade = open.filter(({ i }) => answers[i].text.trim() || answers[i].images.length);
  open.forEach(({ i }) => { if (!answers[i].text.trim() && !answers[i].images.length) results[i] = { verdict: 'wrong', feedback: 'לא נכתבה תשובה.' }; });
  if (toGrade.length) {
    try {
      const graded = await AI.gradeOpen(toGrade.map(({ q, i }) => ({ number: i + 1, question: q.question, answer: q.answer, studentText: answers[i].text.trim(), images: answers[i].images })),
        n => { submit.textContent = '⏳ Claude בודק את התשובות… (' + n.toLocaleString('he-IL') + ')'; });
      graded.forEach(r => { const i = r.number - 1; if (qs[i] && qs[i].type === 'open') results[i] = { verdict: r.verdict, feedback: r.feedback }; });
    } catch (e) {
      submit.disabled = false; submit.textContent = '📤 הגשת המבחן';
      alert(e.message); return;
    }
  }
  examState.graded = true;
  let total = 0;
  paper.querySelectorAll('.q').forEach(box => {
    const i = +box.dataset.i, q = qs[i], r = results[i] || { verdict: 'wrong', feedback: 'לא נבדק.' };
    const got = r.verdict === 'correct' ? per : r.verdict === 'partial' ? per / 2 : 0;
    total += got;
    box.classList.add('done', r.verdict);
    box.querySelector('.mark').replaceChildren(el('span', {class:'pen'}, (r.verdict === 'correct' ? '✓ ' : r.verdict === 'partial' ? '½ ' : '✗ ') + fmt(got) + '/' + fmt(per)));
    if (q.type === 'mc') {
      box.querySelectorAll('.opt').forEach((b, k) => { b.disabled = true; if (k === q.correct) b.classList.add('right'); });
    } else {
      box.querySelectorAll('textarea').forEach(t => { t.readOnly = true; });
      box.querySelectorAll('.tools,.syms').forEach(t => t.remove());
    }
    box.append(el('p', {class:'pen fb'}, r.feedback || ''));
    if (q.type === 'open') box.append(el('details', {class:'model'}, el('summary', {}, 'תשובה לדוגמה'), el('p', {}, q.answer)));
  });
  const final = Math.round(total);
  scoreEl.replaceChildren(el('span', {class:'pen big'}, String(final)));
  const counts = { correct: 0, partial: 0, wrong: 0 };
  results.forEach(r => { counts[(r && r.verdict) || 'wrong']++; });
  const summary = el('div', {class:'summary'},
    el('div', {class:'grade'}, String(final)),
    el('p', {}, `✓ ${counts.correct} נכונות · ½ ${counts.partial} חלקיות · ✗ ${counts.wrong} שגויות`),
    el('div', {class:'row'},
      el('button', {class:'btn primary', type:'button', onclick:() => { examState = { nb: examState.nb, mode: examState.mode }; examStepPages(); }}, '🔁 מבחן חדש'),
      el('button', {class:'btn', type:'button', onclick:() => { examSheet.hidden = true; examState = null; }}, 'סגירה')));
  submit.replaceWith(summary);
  paper.before(summary.cloneNode(true));
  paper.previousSibling.querySelectorAll('.row').forEach(r => r.remove());
  examBody.scrollTop = 0;
}

/* ===== drawing pad for exam answers (grid background, pens, eraser, undo) ===== */
const drawSheet = document.getElementById('draw'), canvas = document.getElementById('drawCanvas'), ctx = canvas.getContext('2d');
let drawDone = null, pen = '#1f2633', erasing = false, undo = [], drawing = false;
function sizeCanvas(){
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = ctx.lineJoin = 'round';
}
function openDraw(done){
  drawDone = done; undo = []; drawSheet.hidden = false;
  requestAnimationFrame(() => { sizeCanvas(); ctx.clearRect(0, 0, canvas.width, canvas.height); });
}
function pos(e){ const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); drawing = true;
  undo.push(ctx.getImageData(0, 0, canvas.width, canvas.height)); if (undo.length > 30) undo.shift();
  ctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
  ctx.strokeStyle = pen; ctx.lineWidth = erasing ? 22 : 3;
  const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + .1, y + .1); ctx.stroke();
});
canvas.addEventListener('pointermove', e => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); });
['pointerup', 'pointercancel'].forEach(t => canvas.addEventListener(t, () => { drawing = false; }));
document.querySelectorAll('#draw [data-pen]').forEach(b => b.addEventListener('click', () => {
  erasing = b.dataset.pen === 'erase'; if (!erasing) pen = b.dataset.pen;
  document.querySelectorAll('#draw [data-pen]').forEach(x => x.classList.toggle('on', x === b));
}));
document.getElementById('drawUndo').addEventListener('click', () => { const s = undo.pop(); if (s) ctx.putImageData(s, 0, 0); });
document.getElementById('drawClear').addEventListener('click', () => { undo.push(ctx.getImageData(0, 0, canvas.width, canvas.height)); ctx.clearRect(0, 0, canvas.width, canvas.height); });
document.getElementById('drawCancel').addEventListener('click', () => { drawSheet.hidden = true; });
document.getElementById('drawSave').addEventListener('click', () => {
  // flatten onto white squared paper so the grader sees what the student saw
  const out = document.createElement('canvas'); out.width = canvas.width; out.height = canvas.height;
  const o = out.getContext('2d'), step = 20 * (window.devicePixelRatio || 1);
  o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height);
  o.strokeStyle = '#dde5ef'; o.lineWidth = 1;
  for (let x = 0; x < out.width; x += step) { o.beginPath(); o.moveTo(x, 0); o.lineTo(x, out.height); o.stroke(); }
  for (let y = 0; y < out.height; y += step) { o.beginPath(); o.moveTo(0, y); o.lineTo(out.width, y); o.stroke(); }
  o.drawImage(canvas, 0, 0);
  const scale = Math.min(1, 1200 / Math.max(out.width, out.height)), small = document.createElement('canvas');
  small.width = Math.round(out.width * scale); small.height = Math.round(out.height * scale);
  small.getContext('2d').drawImage(out, 0, 0, small.width, small.height);
  drawSheet.hidden = true;
  if (drawDone) drawDone(small.toDataURL('image/jpeg', .85));
});

/* pull notebooks and topics added on other devices; redraw only if something changed */
async function syncTopics(){
  if (!AI) return;
  try {
    const data = await AI.store.refresh();
    if (JSON.stringify(data) !== JSON.stringify(DATA)) { DATA = data; if (!document.querySelector('.sheet:not([hidden])')) rerender(); }
  } catch (e) { /* offline: keep the cached copy */ }
}

(function start(){
  const h = (location.hash || '').slice(1);
  syncTopics();
  for (const nb of allNotebooks()) {
    if (nb.id === h) return showNotebook(nb);
    const t = topicsOf(nb).find(x => x.id === h);
    if (t) return showTopic(nb, t);
  }
  showShelf();
})();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncTopics(); });
</script>
<script>
/* offline support when served from the web (the phone app); the desktop app loads from disk and doesn't need it */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
