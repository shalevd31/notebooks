<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המחברות שלי</title>
<meta name="theme-color" content="#e6ebf1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171c26" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="המחברות שלי">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a desk with notebook covers on it → open a notebook to its contents page → open a topic to its lined pages */
:root{
  --desk:#e6ebf1; --desk-2:#d7dee8; --fg:#1f2633; --muted:#5a6475; --line:#c3ccd8; --focus:#3a7bd5;
  --paper:#fdfdf7; --ink:#2a2a3c; --rule:#c9d8ec; --margin:#e88a8a; --pen-pink:#e0628f; --pen-blue:#3a9ad9;
  --hl-y:#fff59d; --hl-p:#f8c8e0; --hl-b:#b9e3f7; --hl-g:#c9e8c0; --hl-tan:#e8d3a8;
  --f-title:'Amatic SC', 'Rubik', cursive; --f-hand:'Playpen Sans Hebrew', 'Rubik', system-ui, sans-serif; --f-ui:'Rubik', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --desk:#171c26; --desk-2:#222a38; --fg:#e8ecf3; --muted:#9aa5b8; --line:#33405a; --focus:#7fb0ff; color-scheme:dark } }
:root[data-theme="dark"]{ --desk:#171c26; --desk-2:#222a38; --fg:#e8ecf3; --muted:#9aa5b8; --line:#33405a; --focus:#7fb0ff; color-scheme:dark }

body{background:var(--desk);color:var(--fg);font-family:var(--f-ui);font-size:16px}
.wrap{max-width:1000px;margin-inline:auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:28px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--f-title);font-size:56px;line-height:1;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:8px;background:var(--desk-2);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px}
.back:hover{border-color:var(--muted)}
.crumbs{color:var(--muted);font-size:15px}

/* shelf */
.shelf{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:clamp(10px, 3vw, 32px)}
.cover svg.tt{flex:none;height:auto;overflow:visible;margin-block:4px}
.top h1 svg{display:block;height:64px;width:auto;max-width:100%;overflow:visible}
.ttl svg{display:block;width:100%;max-width:440px;height:auto;overflow:visible}
@container (max-width: 150px){ .cfoot{display:none} }
/* each cover = a hand-decorated title page: lined paper, spiral, bubble-letter title, subject doodles */
.cover{all:unset;box-sizing:border-box;cursor:pointer;position:relative;container-type:inline-size;aspect-ratio:3/4;max-width:100%;border-radius:4px 10px 10px 4px;background-color:#fbfbf6;background-image:repeating-linear-gradient(to bottom, transparent 0 17px, #d6dde8 17px 18px);padding:14px 34px 12px 14px;display:flex;flex-direction:column;align-items:stretch;box-shadow:0 1px 2px rgba(0,0,0,.1),0 10px 24px rgba(20,30,50,.18);transition:transform .2s;color:#2a2a3c}
.cover:hover{transform:translateY(-4px) rotate(-.6deg)}
.cover:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.cover::after{content:"";position:absolute;inset:10px 8px 10px auto;width:12px;background:radial-gradient(circle at 6px 6px, #4a5263 3px, transparent 3.6px) 0 0/12px 14px repeat-y}
.cover svg{display:block;width:100%;flex:1 1 0;min-height:0}
.bubble{font-family:'Rubik', 'Arial Black', system-ui, sans-serif;font-weight:900;font-size:17cqi;line-height:1.08;text-align:center;text-wrap:balance;padding-block:6px;color:var(--fill);-webkit-text-stroke:.05em #2a2a3c;paint-order:stroke fill;
  text-shadow:0 .07em 0 #fff,0 -.07em 0 #fff,.07em 0 0 #fff,-.07em 0 0 #fff,.05em .05em 0 #fff,-.05em .05em 0 #fff,.05em -.05em 0 #fff,-.05em -.05em 0 #fff,
  0 .12em 0 var(--ring),0 -.12em 0 var(--ring),.12em 0 0 var(--ring),-.12em 0 0 var(--ring),.09em .09em 0 var(--ring),-.09em .09em 0 var(--ring),.09em -.09em 0 var(--ring),-.09em -.09em 0 var(--ring)}
.cfoot{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-family:var(--f-hand);font-size:14px;line-height:1.4}
.cfoot .cnt{background:var(--ring);color:#fff;border-radius:999px;padding:1px 10px;font-family:var(--f-ui);font-size:13px;font-weight:500}

/* paper */
.pages{display:flex;flex-direction:column;gap:28px;align-items:center}
.paper{--m:72px;box-sizing:border-box;width:100%;max-width:794px;position:relative;background-color:var(--paper);color:var(--ink);background-image:linear-gradient(to left, transparent var(--m), var(--margin) var(--m), var(--margin) calc(var(--m) + 2px), transparent calc(var(--m) + 2px)),repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);font-family:var(--f-hand);font-size:16.5px;line-height:32px;padding:32px calc(var(--m) + 20px) 48px 28px;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 28px rgba(20,30,50,.16)}
.paper p,.paper h2,.paper h3,.paper ul{margin:0}
.paper .pg{position:absolute;left:24px;bottom:10px;font-size:13px;color:#8a8a9a}
.ttl{display:flex;justify-content:center;padding-block:16px}
.ttl span{font-family:var(--f-title);font-size:56px;line-height:64px;background:var(--hl-tan);padding:0 24px;border-radius:6px;transform:rotate(-1deg);text-align:center}
.paper h2{font-family:var(--f-title);font-size:36px;line-height:64px}
.paper h2 span{padding:0 12px;border-radius:5px}
.y{background:var(--hl-y);border-radius:4px;padding:0 3px}.p{background:var(--hl-p);border-radius:4px;padding:0 3px}.b{background:var(--hl-b);border-radius:4px;padding:0 3px}.g{background:var(--hl-g);border-radius:4px;padding:0 3px}
.u{text-decoration:underline;text-decoration-color:var(--pen-pink);text-decoration-thickness:2px;text-underline-offset:5px}
.warn{color:#c23b3b}
.fig{display:flex;justify-content:center;padding-block:8px}
.fig svg{width:100%;max-width:520px;height:auto}
.formula{display:flex;justify-content:center;padding-block:16px}
.formula span{direction:ltr;font-size:21px;border:2px solid var(--pen-pink);border-radius:10px;padding:0 22px;background:#fff}
.mode{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start}
.mode>div{flex:1 1 300px;min-width:0}
.mode svg{flex:none;width:200px;max-width:100%;height:auto;margin-top:48px}
.tbl{overflow-x:auto;padding-block:8px}
.tbl table{border-collapse:collapse;width:100%;min-width:460px;font-size:15px}
.tbl th,.tbl td{border:1.5px solid var(--ink);padding:0 8px;line-height:32px;text-align:right;vertical-align:top}
.tbl th{background:var(--hl-y)}
.tip{display:flex;justify-content:center;padding-block:24px 8px}
.tip div{border:2px dashed var(--pen-pink);border-radius:12px;padding:0 18px;background:#fff;text-align:center}

/* contents page */
.toc{list-style:none;padding:0;margin:0}
.toc button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:8px;align-items:baseline;width:100%;min-height:32px;line-height:32px}
.toc button:hover .name{background:var(--hl-y)}
.toc button:focus-visible{outline:3px solid var(--focus)}
.toc .name{border-radius:4px;padding:0 3px}
.toc .dots{flex:1;border-bottom:2px dotted #9aa3b5;transform:translateY(-8px)}
.toc .pp{color:#6b6b80}

@media (max-width:560px){
  .paper{--m:40px;font-size:15.5px;padding-left:16px;padding-right:calc(var(--m) + 12px)}
  .ttl span{font-size:44px}
  .top h1{font-size:46px}
}
@media (prefers-reduced-motion: reduce){ .cover{transition:none} .cover:hover{transform:none} }

/* app shell: full-bleed body, room for the iPhone notch/status bar, no grey tap flash */
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;-webkit-tap-highlight-color:transparent}
.back[hidden]{display:none}

/* squared paper (math / electricity): grid instead of lines, cover and pages alike */
.cover.grid{background-image:repeating-linear-gradient(to bottom, transparent 0 17px, #d6dde8 17px 18px),repeating-linear-gradient(to left, transparent 0 17px, #d6dde8 17px 18px)}
.pages.grid .paper{background-image:linear-gradient(to left, transparent var(--m), var(--margin) var(--m), var(--margin) calc(var(--m) + 2px), transparent calc(var(--m) + 2px)),repeating-linear-gradient(to bottom, transparent 0 15px, var(--rule) 15px 16px),repeating-linear-gradient(to left, transparent 0 15px, var(--rule) 15px 16px)}
.wrap{padding-top:max(28px, calc(env(safe-area-inset-top, 0px) + 12px));padding-bottom:max(64px, calc(env(safe-area-inset-bottom, 0px) + 24px))}

/* header buttons, "add topic" on the contents page, actions under a topic */
.hbtns{display:flex;gap:8px;align-items:center}
.gear{padding:10px 14px}
.addtopic{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:32px;line-height:32px;color:var(--pen-pink);font-weight:600}
.addtopic:hover span{background:var(--hl-p);border-radius:4px}
.addtopic:focus-visible{outline:3px solid var(--focus)}
.tactions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:794px}
.tactions button,.sheet .btn{display:inline-flex;align-items:center;gap:6px;background:var(--desk-2);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px}
.tactions button:hover,.sheet .btn:hover{border-color:var(--muted)}
.sheet .btn.primary{background:var(--pen-pink);border-color:var(--pen-pink);color:#fff}
.sheet .btn:disabled{opacity:.55;cursor:default}

/* full-screen sheets: chat with Claude, settings */
.sheet{position:fixed;inset:0;z-index:20;background:var(--desk);color:var(--fg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
.sheet[hidden]{display:none}
.shead{display:flex;align-items:center;gap:12px;padding:12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));border-bottom:1px solid var(--line)}
.shead b{flex:1;font-size:18px}
.shead button{background:none;border:1px solid var(--line);border-radius:999px;min-width:44px;min-height:44px;cursor:pointer}
.slog{flex:1;overflow-y:auto;padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.msg{max-width:min(640px, 88%);padding:10px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-start;background:var(--pen-pink);color:#fff;border-end-start-radius:4px}
.msg.ai{align-self:flex-end;background:var(--desk-2);border:1px solid var(--line);border-end-end-radius:4px}
.msg.note{align-self:center;background:none;color:var(--muted);font-size:14px;padding:4px}
.msg.err{align-self:center;color:#c23b3b;background:none;font-size:15px;text-align:center}
.msg img{display:block;max-width:180px;max-height:180px;border-radius:8px;margin-bottom:6px}
.prop{align-self:stretch;display:flex;flex-direction:column;gap:12px;align-items:center;border:2px dashed var(--pen-pink);border-radius:16px;padding:12px}
.prop .pages{width:100%;gap:16px}
.prop .ptitle{font-weight:700}
.sfiles{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px}
.sfiles span{background:var(--desk-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;cursor:pointer}
.sform{display:flex;gap:8px;align-items:flex-end;padding:10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));border-top:1px solid var(--line)}
.sform textarea{flex:1;font:inherit;font-size:16px;resize:none;max-height:40vh;min-height:44px;padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:var(--desk-2);color:var(--fg)}
.sform .icon{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--desk-2);cursor:pointer;font-size:20px}
.sform .send{background:var(--pen-pink);border-color:var(--pen-pink);color:#fff}
.sform .send:disabled{opacity:.5}
.sbody{flex:1;overflow-y:auto;padding:20px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px;max-width:640px;width:100%;box-sizing:border-box;margin-inline:auto}
.sbody label{display:flex;flex-direction:column;gap:6px;font-weight:500}
.sbody input,.sbody textarea{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--desk-2);color:var(--fg);direction:ltr;text-align:left}
.sbody small{color:var(--muted);font-weight:400}
.sbody .row{display:flex;gap:10px;flex-wrap:wrap}
.sbody .status{min-height:1.5em}
</style>
</head>
<body>

<div class="wrap" dir="rtl" lang="he">
  <header class="top">
    <div>
      <h1 id="hTitle">המחברות שלי</h1>
      <p id="hSub" class="crumbs">בחרו מחברת כדי לפתוח אותה</p>
    </div>
    <div class="hbtns">
      <button class="back" id="backBtn" type="button" hidden>→ <span id="backTxt">חזרה</span></button>
      <button class="back gear" id="gearBtn" type="button" aria-label="הגדרות">⚙️</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<!-- chat with Claude: writes a new topic (or changes one) and adds it to the notebook -->
<section class="sheet" id="chat" dir="rtl" lang="he" hidden role="dialog" aria-modal="true" aria-labelledby="chatTitle">
  <div class="shead"><b id="chatTitle">נושא חדש</b><button type="button" id="chatClose" aria-label="סגירה">✕</button></div>
  <div class="slog" id="chatLog" aria-live="polite"></div>
  <div class="sfiles" id="chatFiles"></div>
  <form class="sform" id="chatForm">
    <label class="icon" aria-label="צירוף תמונה או PDF">📷<input type="file" id="chatFile" accept="image/*,application/pdf" multiple hidden></label>
    <textarea id="chatText" rows="1" placeholder="כתבו את החומר או צרפו תמונה…"></textarea>
    <button class="icon send" id="chatSend" type="submit" aria-label="שליחה">↑</button>
  </form>
</section>

<!-- settings: keys stay on this device only -->
<section class="sheet" id="settings" dir="rtl" lang="he" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="shead"><b id="setTitle">הגדרות</b><button type="button" id="setClose" aria-label="סגירה">✕</button></div>
  <div class="sbody">
    <label>קוד הגדרה <small>מדביקים כאן את הקוד שקיבלתם, וזה ממלא את שני השדות למטה</small>
      <textarea id="setCode" rows="3" placeholder="NB1:…"></textarea></label>
    <div class="row"><button class="btn" type="button" id="setApply">החלת הקוד</button></div>
    <label>מפתח API של Claude <input id="setKey" type="password" autocomplete="off" placeholder="sk-ant-…"></label>
    <label>טוקן GitHub (לשמירה ולסנכרון) <input id="setGh" type="password" autocomplete="off" placeholder="github_pat_…"></label>
    <div class="row"><button class="btn primary" type="button" id="setSave">שמירה</button><button class="btn" type="button" id="setCopy">העתקת קוד הגדרה למכשיר אחר</button></div>
    <p class="status" id="setStatus"></p>
  </div>
</section>

<!-- ============ Topic: שנאי (מחברת המרת אנרגיה) ============ -->
<template id="t-transformer">
<article class="paper">
  <div class="ttl"><span>שנאי – סיכום לבוחן</span></div>
  <h2><span class="b">1. מבנה השנאי</span></h2>
  <p>• <span class="y">ליבת ברזל מרובדת</span> – פחים דקים ומבודדים, מקטינים זרמי מערבולת. מובילה את השטף המגנטי.</p>
  <p>• <span class="p">ליפוף ראשוני (N1)</span> – מחובר למקור המתח (כניסה).</p>
  <p>• <span class="b">ליפוף משני (N2)</span> – מחובר לצרכן (יציאה).</p>
  <p>← אין חיבור חשמלי בין הליפופים, <span class="u">רק צימוד מגנטי</span> דרך הליבה.</p>
  <div class="fig">
  <svg viewBox="0 0 520 208" role="img" aria-label="איור מבנה שנאי: ליבה, ליפוף ראשוני, ליפוף משני ושטף">
  <path d="M160 22H360V182H160Z M200 62V142H320V62Z" fill="#e3e0d6" fill-rule="evenodd" stroke="#2a2a3c" stroke-width="2"/>
  <path d="M180 42H340V162H180Z" fill="none" stroke="#8a6fd1" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M252 42H274M266 36L274 42L266 48" fill="none" stroke="#8a6fd1" stroke-width="2.5" stroke-linecap="round"/>
  <text x="262" y="16" text-anchor="middle" font-size="18" fill="#8a6fd1">Φ</text>
  <g stroke="#e0628f" stroke-width="4" stroke-linecap="round"><line x1="150" x2="210" y1="70" y2="70"/><line x1="150" x2="210" y1="82" y2="82"/><line x1="150" x2="210" y1="94" y2="94"/><line x1="150" x2="210" y1="106" y2="106"/><line x1="150" x2="210" y1="118" y2="118"/><line x1="150" x2="210" y1="130" y2="130"/></g>
  <path d="M150 70H80V88M150 130H80V112" fill="none" stroke="#e0628f" stroke-width="2"/>
  <circle cx="80" cy="100" r="12" fill="none" stroke="#e0628f" stroke-width="2"/>
  <text x="80" y="106" text-anchor="middle" font-size="18" fill="#2a2a3c">~</text>
  <g stroke="#3a9ad9" stroke-width="4" stroke-linecap="round"><line x1="310" x2="370" y1="80" y2="80"/><line x1="310" x2="370" y1="96" y2="96"/><line x1="310" x2="370" y1="112" y2="112"/><line x1="310" x2="370" y1="128" y2="128"/></g>
  <path d="M370 80H440V86M370 128H440V122" fill="none" stroke="#3a9ad9" stroke-width="2"/>
  <rect x="430" y="86" width="20" height="36" rx="3" fill="#d8eefb" stroke="#3a9ad9" stroke-width="2"/>
  <text x="462" y="110" font-size="15" fill="#2a2a3c">R</text>
  <text x="80" y="200" text-anchor="middle" font-size="14" fill="#c2436f">ראשוני N1</text>
  <text x="260" y="200" text-anchor="middle" font-size="14" fill="#2a2a3c">ליבת ברזל</text>
  <text x="440" y="200" text-anchor="middle" font-size="14" fill="#1f6fa8">משני N2</text>
  </svg>
  </div>
  <h2><span class="g">2. עקרון הפעולה</span></h2>
  <p>השנאי פועל לפי <span class="y">חוק פאראדיי – השראה אלקטרומגנטית</span>:</p>
  <p>1. מזינים את הליפוף הראשוני ב<span class="u">מתח חילופין (AC)</span>.</p>
  <p>2. הזרם המשתנה יוצר בליבה <span class="p">שטף מגנטי משתנה Φ</span>.</p>
  <p>3. השטף עובר דרך הליבה אל הליפוף המשני.</p>
  <p>4. השטף המשתנה <span class="b">משרה מתח</span> בליפוף המשני.</p>
  <p class="warn"><b>!!</b> בזרם ישר (DC) השטף קבוע ← לא נוצר מתח במשני!</p>
  <div class="formula"><span>a = N1/N2 = V1/V2 = I2/I1</span></div>
  <p>• N2 &gt; N1 ← שנאי <span class="g">מעלה מתח</span> (הזרם במשני קטן).</p>
  <p>• N2 &lt; N1 ← שנאי <span class="p">מוריד מתח</span> (הזרם במשני גדל).</p>
  <span class="pg">עמוד 1</span>
</article>

<article class="paper">
  <div class="ttl"><span>3. מצבי העבודה של השנאי</span></div>

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const k in (attrs||{})) { if (k === 'class') n.className = attrs[k]; else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]); else n.setAttribute(k, attrs[k]); }
  kids.flat().forEach(c => n.append(c));
  return n;
}
function setHash(t){ try { history.replaceState(null, '', t ? '#' + t : location.pathname + location.search); } catch(e){} }

/* bubble letters like a hand-drawn notebook title: colored outer ring, white gap, dark outline, colored fill */
function bubbleSvg(text, fill, ring, opts = {}){
  const lines = opts.oneLine ? [text] : text.split(' ');
  const maxLen = Math.max(...lines.map(l => l.length));
  const fs = opts.fs || Math.min(70, 286 / (maxLen * 0.66 + 0.45));
  const W = opts.fixedW || Math.round(maxLen * fs * 0.66 + fs * 0.45 + 10);
  const lh = fs * 1.04, pad = fs * 0.22;
  let out = '';
  lines.forEach((l, i) => {
    const y = (pad + fs * 0.84 + i * lh).toFixed(1);
    const t = extra => `<text x="${W/2}" y="${y}" text-anchor="middle" direction="rtl" font-family="Rubik, 'Arial Black', sans-serif" font-weight="900" font-size="${fs.toFixed(1)}" stroke-linejoin="round" stroke-linecap="round" ${extra}>${l}</text>`;
    out += t(`fill="${ring}" stroke="${ring}" stroke-width="${(fs*0.36).toFixed(1)}"`) +
           t(`fill="#ffffff" stroke="#ffffff" stroke-width="${(fs*0.23).toFixed(1)}"`) +
           t(`fill="${fill}" stroke="${O}" stroke-width="${(fs*0.1).toFixed(1)}"`) +
           t(`fill="${fill}"`);
  });
  const H = Math.round(pad * 2 + fs * 0.9 + (lines.length - 1) * lh + fs * 0.12);
  const d = document.createElement('div');
  d.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${text}">${out}</svg>`;
  return d.firstChild;
}

    const art = ART[nb.art](nb.ring);
    const n = topicsOf(nb).length;
    const b = el('button', {class:'cover' + (nb.paper === 'grid' ? ' grid' : ''), type:'button', style:`--fill:${nb.fill};--ring:${nb.ring}`, 'aria-label':'פתיחת המחברת ' + nb.title, onclick:() => showNotebook(nb)},
      svgFrom(art.top),
      (() => { const s = bubbleSvg(nb.title, nb.fill, nb.ring, {fixedW:300}); s.classList.add('tt'); return s; })(),
      svgFrom(art.bot),
      el('span', {class:'cfoot'}, el('span', {class:'cnt'}, n === 0 ? 'ריקה' : n === 1 ? 'נושא 1' : n + ' נושאים')));
    shelf.append(b);
  });
  view.replaceChildren(shelf);
  window.scrollTo(0,0);
}

/* ===== topics added from the app: saved in docs/topics.json on GitHub, cached on the device ===== */
const AI = window.NBAI || null;
let CUSTOM = AI ? AI.topics.cached() : [];
let rerender = () => showShelf();
function topicsOf(nb){ return nb.topics.concat(CUSTOM.filter(t => t.notebook === nb.id)); }
function pageCount(t){
  if (t.html) return t.pageCount || 1;
  const tpl = document.getElementById('t-' + t.id);
  return (tpl && tpl.content.querySelectorAll('article').length) || 1;
}
function firstPage(nb, t){ let p = 1; for (const x of topicsOf(nb)) { if (x === t) break; p += pageCount(x); } return p; }

function showNotebook(nb){
  setHeader(nb.title);
  hSub.textContent = 'המחברות שלי › ' + nb.title;
  setBack('כל המחברות', showShelf); setHash(nb.id);
  rerender = () => showNotebook(nb);
  const all = topicsOf(nb);
  const list = el('ul', {class:'toc'});
  all.forEach((t, i) => {
    const a = firstPage(nb, t), b = a + pageCount(t) - 1;
    list.append(el('li', {}, el('button', {type:'button', onclick:() => showTopic(nb, t)},
      el('span', {class:'name'}, (i+1) + '. ' + t.title), el('span', {class:'dots', 'aria-hidden':'true'}), el('span', {class:'pp'}, 'עמ׳ ' + (a === b ? a : a + '–' + b)))));
  });
  const paper = el('article', {class:'paper'},
    el('div', {class:'ttl'}, bubbleSvg('תוכן עניינים', nb.fill, nb.ring, {oneLine:true, fs:60})),
    el('p', {}, 'מחברת: ', el('span', {class:'y'}, nb.title)),
    el('p', {}, ' '), all.length ? list : el('p', {}, 'עדיין אין נושאים במחברת הזאת – הם יופיעו כאן.'),
    el('p', {}, ' '),
    el('button', {class:'addtopic', type:'button', onclick:() => openChat(nb)}, '＋ ', el('span', {}, 'נושא חדש עם Claude')));
  view.replaceChildren(el('div', {class:'pages' + (nb.paper === 'grid' ? ' grid' : ''), style:`--hl-tan:${nb.fill}`}, paper));
  window.scrollTo(0,0);
}

function topicPages(nb, t){
  const frag = document.createDocumentFragment();
  if (t.html) {
    const d = document.createElement('div');
    d.innerHTML = AI ? AI.sanitize(t.html) : '';
    let p = firstPage(nb, t);
    d.querySelectorAll('article.paper').forEach(a => { a.querySelectorAll('.pg').forEach(x => x.remove()); a.append(el('span', {class:'pg'}, 'עמוד ' + p++)); });
    frag.append(...d.childNodes);
  } else {
    const tpl = document.getElementById('t-' + t.id);
    if (tpl) frag.append(tpl.content.cloneNode(true));
  }
  return frag;
}

function showTopic(nb, t){
  setHeader(t.title);
  hSub.textContent = 'המחברות שלי › ' + nb.title + ' › ' + t.title;
  setBack('לתוכן העניינים', () => showNotebook(nb)); setHash(t.id);
  rerender = () => { const fresh = topicsOf(nb).find(x => x.id === t.id); fresh ? showTopic(nb, fresh) : showNotebook(nb); };
  const wrap = el('div', {class:'pages' + (nb.paper === 'grid' ? ' grid' : '')}, topicPages(nb, t));
  if (t.html) wrap.append(el('div', {class:'tactions'},
    el('button', {type:'button', onclick:() => openChat(nb, t)}, '✏️ שינוי עם Claude'),
    el('button', {type:'button', onclick:() => deleteTopic(nb, t)}, '🗑 מחיקת הנושא')));
  view.replaceChildren(wrap);
  window.scrollTo(0,0);
}

async function deleteTopic(nb, t){
  if (!confirm('למחוק את הנושא "' + t.title + '"?')) return;
  try { CUSTOM = await AI.topics.remove(t.id); showNotebook(nb); }
  catch (e) { alert(e.message); }
}

/* ===== chat sheet ===== */
const chat = document.getElementById('chat'), chatLog = document.getElementById('chatLog'), chatForm = document.getElementById('chatForm');
const chatText = document.getElementById('chatText'), chatFile = document.getElementById('chatFile'), chatFiles = document.getElementById('chatFiles'), chatSend = document.getElementById('chatSend');
let session = null, chatNb = null, chatTopic = null, files = [], busy = false;

function logMsg(cls, ...kids){ const m = el('div', {class:'msg ' + cls}, ...kids); chatLog.append(m); chatLog.scrollTop = chatLog.scrollHeight; return m; }
function showFiles(){ chatFiles.replaceChildren(...files.map((f, i) => el('span', {title:'הסרה', onclick:() => { files.splice(i, 1); showFiles(); }}, '📎 ' + f.name + ' ✕'))); }

function openChat(nb, topic){
  if (!AI) return alert('הצ׳אט לא נטען. בדקו חיבור לאינטרנט.');
  chatNb = nb; chatTopic = topic || null; files = []; showFiles();
  const tpl = document.getElementById('t-transformer');
  session = new AI.ChatSession({ notebookTitle: nb.title, exampleHtml: tpl ? tpl.innerHTML.trim() : '', existing: topic ? {title: topic.title, html: topic.html} : null });
  document.getElementById('chatTitle').textContent = topic ? 'שינוי: ' + topic.title : 'נושא חדש · ' + nb.title;
  chatLog.replaceChildren();
  logMsg('ai', topic
    ? 'מה לשנות ב"' + topic.title + '"? אפשר לבקש להוסיף, לקצר, לתקן או להוסיף שרטוט.'
    : 'היי! על איזה נושא נכין דף ב' + nb.title + '?\nאפשר לכתוב את החומר, להדביק סיכום, או לצלם דפים מהמחברת 📷 ואני אסדר הכול בסגנון המחברת.');
  if (!AI.settings.get().anthropicKey) logMsg('err', 'קודם צריך להגדיר מפתח API ב⚙️ הגדרות.');
  chat.hidden = false;
  chatText.focus();
}
document.getElementById('chatClose').addEventListener('click', () => {
  if (busy && !confirm('Claude עדיין כותב. לסגור בכל זאת?')) return;
  chat.hidden = true; session = null; rerender();
});
chatFile.addEventListener('change', () => { files.push(...chatFile.files); chatFile.value = ''; showFiles(); });
chatText.addEventListener('input', () => { chatText.style.height = 'auto'; chatText.style.height = chatText.scrollHeight + 'px'; });
chatText.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); chatForm.requestSubmit(); } });

chatForm.addEventListener('submit', async e => {
  e.preventDefault();
  if (busy || !session) return;
  const text = chatText.value, sent = files.slice();
  if (!text.trim() && !sent.length) return;
  const me = logMsg('me');
  for (const f of sent) if (f.type.startsWith('image/')) me.append(el('img', {src: URL.createObjectURL(f), alt: ''})); else me.append('📎 ' + f.name + '\n');
  me.append(text);
  chatText.value = ''; chatText.style.height = 'auto'; files = []; showFiles();
  await converse(s => session.send(text, sent, s));
});

async function converse(start){
  busy = true; chatSend.disabled = true;
  const mySession = session;
  let bubble = null, status = logMsg('note', 'Claude חושב…');
  await start(ev => {
    if (session !== mySession) return; // chat was closed meanwhile
    if (ev.type === 'text') {
      if (!bubble) { bubble = logMsg('ai'); chatLog.append(status); }
      bubble.textContent += ev.text; chatLog.scrollTop = chatLog.scrollHeight;
    } else if (ev.type === 'writing') {
      status.textContent = '✍️ כותב את הדפים… (' + ev.chars.toLocaleString('he-IL') + ' תווים)';
    } else if (ev.type === 'proposal') {
      showProposal(ev.title, ev.html);
    } else if (ev.type === 'error') {
      const m = logMsg('err', ev.message);
      if (ev.retryable) m.append(' ', el('button', {class:'btn', type:'button', onclick:() => { m.remove(); converse(s => session.retry(s)); }}, 'לנסות שוב'));
    }
  });
  status.remove();
  busy = false; chatSend.disabled = false;
}

function showProposal(title, html){
  const pages = el('div', {class:'pages' + (chatNb.paper === 'grid' ? ' grid' : '')});
  pages.innerHTML = html;
  const add = el('button', {class:'btn primary', type:'button'}, chatTopic ? '💾 שמירת השינויים' : '➕ הוספה למחברת');
  add.addEventListener('click', async () => {
    add.disabled = true; add.textContent = 'שומר…';
    const topic = { id: chatTopic ? chatTopic.id : 'u' + Date.now().toString(36), notebook: chatNb.id, title, html,
      pageCount: Math.max(1, pages.querySelectorAll('article.paper').length), created: chatTopic ? chatTopic.created : new Date().toISOString(), updated: new Date().toISOString() };
    try {
      CUSTOM = await AI.topics.save(topic);
      chat.hidden = true; session = null;
      showTopic(chatNb, CUSTOM.find(t => t.id === topic.id) || topic);
    } catch (err) {
      add.disabled = false; add.textContent = chatTopic ? '💾 שמירת השינויים' : '➕ הוספה למחברת';
      logMsg('err', err.message);
    }
  });
  const box = el('div', {class:'prop'}, el('div', {class:'ptitle'}, '📒 ' + title), pages, add, el('div', {class:'msg note'}, 'רוצים לשנות משהו? פשוט כתבו לי.'));
  chatLog.append(box);
  box.scrollIntoView({block:'start'});
}

/* ===== settings sheet ===== */
const sheet = document.getElementById('settings'), setKey = document.getElementById('setKey'), setGh = document.getElementById('setGh'), setStatus = document.getElementById('setStatus'), setCode = document.getElementById('setCode');
function fillSettings(){ const s = AI ? AI.settings.get() : {}; setKey.value = s.anthropicKey || ''; setGh.value = s.githubToken || ''; setCode.value = ''; }
document.getElementById('gearBtn').addEventListener('click', () => {
  if (!AI) return alert('ההגדרות לא נטענו.');
  fillSettings(); setStatus.textContent = AI.settings.get().anthropicKey && AI.settings.get().githubToken ? '✓ הכול מוגדר' : 'צריך למלא את שני השדות, או להדביק קוד הגדרה.'; sheet.hidden = false;
});
document.getElementById('setClose').addEventListener('click', () => { sheet.hidden = true; });
document.getElementById('setApply').addEventListener('click', () => {
  try { AI.settings.fromSetupCode(setCode.value); fillSettings(); setStatus.textContent = '✓ הקוד הוחל ונשמר במכשיר הזה'; syncTopics(); }
  catch (e) { setStatus.textContent = e.message; }
});
document.getElementById('setSave').addEventListener('click', () => {
  AI.settings.set({ anthropicKey: setKey.value.trim(), githubToken: setGh.value.trim() });
  setStatus.textContent = '✓ נשמר במכשיר הזה'; syncTopics();
});
document.getElementById('setCopy').addEventListener('click', async () => {
  const code = AI.settings.toSetupCode();
  setCode.value = code; setCode.select();
  try { await navigator.clipboard.writeText(code); setStatus.textContent = '✓ הועתק. שלחו את הקוד לטלפון והדביקו אותו שם בהגדרות.'; }
  catch { document.execCommand('copy'); setStatus.textContent = 'סמנו והעתיקו את הקוד מהשדה למעלה.'; }
});

/* pull topics added on other devices; redraw only if something changed */
async function syncTopics(){
  if (!AI) return;
  try {
    const list = await AI.topics.refresh();
    if (JSON.stringify(list) !== JSON.stringify(CUSTOM)) { CUSTOM = list; if (chat.hidden && sheet.hidden) rerender(); }
  } catch (e) { /* offline: keep the cached copy */ }
}

(function start(){
  const h = (location.hash || '').slice(1);
  syncTopics();
  for (const nb of NOTEBOOKS) {
    if (nb.id === h) return showNotebook(nb);
    const t = topicsOf(nb).find(x => x.id === h);
    if (t) return showTopic(nb, t);
  }
  showShelf();
})();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncTopics(); });
</script>
<script>
/* offline support when served from the web (the phone app); the desktop app loads from disk and doesn't need it */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
