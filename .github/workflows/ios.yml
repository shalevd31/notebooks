# Builds the iPhone app file (Notebooks.ipa) on a GitHub Mac, unsigned.
# Sideloadly signs it with your Apple ID when you install it on the phone.
# The finished file is attached to the "iphone" release: https://github.com/shalevd31/notebooks/releases/tag/iphone
name: iPhone app (IPA)

on:
  push:
    branches: [main]
    # topics added from the app live in docs/topics.json and load at runtime, so they don't need a new IPA
    paths: ['docs/**', '!docs/topics.json', 'capacitor.config.json', 'build/icon-1024.png', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install tools
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Create the iPhone project
        run: |
          npx cap add ios --packagemanager SPM
          cp build/icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          # the chat's 📷 button opens the camera / photo library, which iOS only allows with these texts
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'צילום דפי מחברת כדי ש-Claude יסכם אותם'" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'בחירת תמונות של דפי מחברת כדי ש-Claude יסכם אותם'" ios/App/App/Info.plist
          npx cap sync ios

      - name: Build (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R ios-build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Notebooks.ipa Payload
          ls -la Notebooks.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Notebooks-ipa
          path: Notebooks.ipa

      - name: Publish to the "iphone" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete iphone -y --cleanup-tag || true
          gh release create iphone Notebooks.ipa --target "$GITHUB_SHA" --title "אפליקציה לאייפון" \
            --notes "מורידים את Notebooks.ipa ומתקינים עם Sideloadly. ההוראות ב-README."
